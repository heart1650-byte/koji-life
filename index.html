<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ef"><title>糀Life｜発酵でつくる、やさしい毎日</title>
<style>
:root{--cream:#fffaf3;--paper:#fff;--ink:#493c35;--muted:#8a7c72;--pink:#e99b9f;--pink2:#fbe5e3;--sage:#dce8d5;--gold:#d6ad62;--line:#eee3d8;--shadow:0 12px 34px rgba(91,66,48,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 18px}.top{position:sticky;top:0;z-index:20;background:rgba(255,250,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}header{height:72px;display:flex;align-items:center;gap:18px}.logo{font-family:serif;font-size:27px;font-weight:800;white-space:nowrap}.logo i{font-style:normal;color:var(--pink)}.search{flex:1;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:12px 17px;font-size:15px}.heart{margin-left:auto;border:0;background:var(--pink2);border-radius:99px;padding:11px 15px;font-size:18px;cursor:pointer}
.hero{margin:24px 0 20px;padding:34px clamp(22px,5vw,58px);border-radius:32px;background:linear-gradient(135deg,#fbe7df,#fff3db);position:relative;overflow:hidden;min-height:215px;display:flex;align-items:center}.hero:after{content:"🌾  🌸  🍚";position:absolute;right:5%;bottom:18%;font-size:clamp(34px,7vw,72px);opacity:.78}.hero h1{font-family:serif;font-size:clamp(31px,5vw,52px);line-height:1.28;margin:0 0 12px;max-width:650px}.hero p{font-size:16px;line-height:1.8;margin:0;max-width:600px}.eyebrow{font-size:13px;font-weight:700;color:#9c6d61;letter-spacing:.1em;margin-bottom:8px}
.quick{display:flex;gap:10px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 15px;white-space:nowrap;cursor:pointer;color:var(--ink)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:16px 0 12px}.sectionHead h2{font-size:24px;margin:0}.sectionHead span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}.photo{height:185px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;background:linear-gradient(145deg,#f6e1c9,#f9eee1)}.photo small{position:absolute;right:10px;bottom:9px;background:#ffffffdc;padding:4px 8px;border-radius:99px;font-size:10px;color:var(--muted)}.fav{position:absolute;right:10px;top:10px;border:0;background:#fffffff0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.cardbody{padding:16px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 9px;border-radius:99px;background:var(--pink2)}.tag.green{background:var(--sage)}.card h3{font-size:18px;margin:10px 0 7px}.meta{font-size:12px;color:var(--muted)}
.daily{margin:28px 0;background:#fff;border:1px solid var(--line);border-radius:25px;padding:22px;display:flex;gap:18px;align-items:center}.daily .icon{font-size:42px}.daily h3{margin:0 0 5px}.daily p{margin:0;color:var(--muted);font-size:14px}
.empty{display:none;text-align:center;padding:45px;color:var(--muted)}
.bottom{display:none}.modal{display:none;position:fixed;inset:0;background:#3d332d66;z-index:50;padding:18px;overflow:auto}.modal.on{display:block}.sheet{max-width:720px;margin:4vh auto;background:#fff;border-radius:28px;overflow:hidden}.sheetTop{height:240px;background:linear-gradient(145deg,#f5dfc8,#fff0df);display:flex;align-items:center;justify-content:center;font-size:100px;position:relative}.close{position:absolute;right:16px;top:16px;border:0;border-radius:50%;width:42px;height:42px;background:#fff;font-size:22px}.sheetBody{padding:24px}.sheetBody h2{margin:0 0 8px;font-size:28px}.servings{display:flex;gap:8px;margin:20px 0}.servings button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px}.servings button.on{background:var(--ink);color:#fff}.ingredients{width:100%;border-collapse:collapse}.ingredients td{padding:11px 4px;border-bottom:1px solid var(--line)}.ingredients td:last-child{text-align:right;font-weight:700}.steps{padding-left:24px;line-height:1.9}.note{background:#fff5e9;border-radius:18px;padding:15px;margin-top:20px;font-size:14px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero:after{opacity:.25}.search{display:none}}
@media(max-width:560px){body{padding-bottom:78px}.wrap{padding:0 13px}header{height:62px}.logo{font-size:23px}.hero{margin-top:12px;border-radius:24px;padding:26px 20px;min-height:190px}.hero h1{font-size:31px}.grid{grid-template-columns:1fr;gap:14px}.photo{height:210px}.daily{align-items:flex-start}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;font-size:11px;color:var(--muted)}.bottom b{display:block;font-size:21px;margin-bottom:2px}.sheet{margin:0;min-height:100%;border-radius:24px 24px 0 0}.modal{padding:35px 0 0}.sheetTop{height:220px}}
</style></head>
<body><div class="top"><div class="wrap"><header><div class="logo">糀<i>Life</i></div><input id="search" class="search" placeholder="料理名・食材からレシピを検索"><button class="heart" onclick="showFav()">♡ <span id="favCount">0</span></button></header></div></div>
<main class="wrap"><section class="hero"><div><div class="eyebrow">今日のごはんが、ちょっと楽しみになる。</div><h1>発酵でつくる、<br>やさしい毎日。</h1><p>むずかしく考えなくて大丈夫。いつものごはんに糀のやさしさを。家族が「また作って」と言いたくなるレシピを集めました。</p></div></section>
<div class="quick" id="filters"><button class="chip on" data-f="all">すべて</button><button class="chip" data-f="koji">🌾 糀を使う</button><button class="chip" data-f="no">糀を使わない</button><button class="chip" data-f="main">🍳 主菜</button><button class="chip" data-f="side">🥗 副菜</button><button class="chip" data-f="sweet">🍮 スイーツ</button><button class="chip" data-f="sauce">🥣 ソース</button></div>
<div class="daily"><div class="icon">💡</div><div><h3>「今日、何つくろう？」に迷ったら</h3><p>冷蔵庫にある食材や気分で検索。お気に入り♡を押すと、この端末に保存されて次回すぐ見つかります。</p></div></div>
<div class="sectionHead"><h2 id="listTitle">今日作りたいレシピ</h2><span id="count"></span></div><section class="grid" id="grid"></section><div class="empty" id="empty">条件に合うレシピがありません。検索条件を変えてみてください 🌿</div></main>
<nav class="bottom"><button onclick="resetAll()"><b>⌂</b>ホーム</button><button onclick="focusSearch()"><b>⌕</b>レシピ</button><button><b>🧺</b>マルシェ</button><button onclick="showFav()"><b>♡</b>お気に入り</button><button><b>☺</b>マイページ</button></nav>
<div class="modal" id="modal"><article class="sheet"><div class="sheetTop" id="detailEmoji"><button class="close" onclick="closeModal()">×</button></div><div class="sheetBody"><div class="tags" id="detailTags"></div><h2 id="detailTitle"></h2><div class="meta" id="detailMeta"></div><div class="servings"><button data-s="1">1人分</button><button class="on" data-s="2">2人分</button><button data-s="4">4人分</button></div><h3>材料</h3><table class="ingredients" id="ingredients"></table><h3>作り方</h3><ol class="steps" id="steps"></ol><div class="note" id="note"></div></div></article></div>
<script>
const recipes=[
{id:1,title:"ケンタッキー風チキン",emoji:"🍗",type:"main",koji:true,time:"30分",desc:"家族が喜ぶ、やわらかジューシーな定番",ing:[["鶏肉",300,"g"],["糀調味料",30,"g"],["米粉",40,"g"],["油",null,"適量"]],steps:["鶏肉を食べやすい大きさに切り、糀調味料となじませる。","米粉をまぶし、火が通るまで香ばしく揚げ焼きにする。"],note:"分量は2人分を基準に表示しています。"},
{id:2,title:"奈良漬入りポテトサラダ",emoji:"🥔",type:"side",koji:false,time:"20分",desc:"いつものポテサラに、楽しいアクセント",ing:[["じゃがいも",300,"g"],["奈良漬",30,"g"],["マヨネーズ",30,"g"]],steps:["じゃがいもをやわらかくして粗くつぶす。","刻んだ奈良漬と調味料を混ぜる。"],note:"奈良漬の塩味を見ながら味を整えてください。"},
{id:3,title:"季節のグリル野菜",emoji:"🥕",type:"side",koji:true,time:"25分",desc:"野菜の甘みを楽しむ、あと一品",ing:[["季節の野菜",300,"g"],["糀調味料",20,"g"],["油",15,"ml"]],steps:["野菜を食べやすく切る。","糀調味料と油をなじませ、香ばしく焼く。"],note:"冷蔵庫にある野菜で気軽にどうぞ。"},
{id:4,title:"黒蜜きなこの甘糀お豆腐豆花",emoji:"🍮",type:"sweet",koji:true,time:"15分",desc:"ほっとする甘さの発酵おやつ",ing:[["豆腐",200,"g"],["甘糀",40,"g"],["きなこ",10,"g"],["黒蜜",null,"お好み"]],steps:["豆腐と甘糀をなめらかになるまで合わせる。","器に盛り、きなこと黒蜜を添える。"],note:"甘さは甘糀と黒蜜でお好みに調整してください。"},
{id:5,title:"トマトのごま味噌和え",emoji:"🍅",type:"side",koji:false,time:"10分",desc:"切って和えるだけ。忙しい日の味方",ing:[["トマト",2,"個"],["味噌",20,"g"],["すりごま",15,"g"]],steps:["トマトを食べやすく切る。","味噌とすりごまを合わせ、トマトをやさしく和える。"],note:"食べる直前に和えると水っぽくなりにくいです。"},
{id:6,title:"牛肉と夏野菜のオイスター炒め",emoji:"🥘",type:"main",koji:true,time:"20分",desc:"ごはんが進む、満足おかず",ing:[["牛肉",200,"g"],["夏野菜",250,"g"],["糀調味料",20,"g"],["オイスターソース",20,"g"]],steps:["牛肉と野菜を食べやすく切る。","牛肉、野菜の順に炒め、調味料を加えて仕上げる。"],note:"野菜は季節のものに置き換えて楽しめます。"},
{id:7,title:"米粉パンケーキ",emoji:"🥞",type:"sweet",koji:false,time:"20分",desc:"休日の朝にうれしい、ふんわりおやつ",ing:[["米粉",120,"g"],["豆乳",120,"ml"],["卵",1,"個"]],steps:["材料を混ぜ合わせる。","温めたフライパンで両面をふんわり焼く。"],note:"卵など個数の材料は人数変更時に端数になる場合があります。"},
{id:8,title:"りんごとお芋の重ね煮甘糀アイス",emoji:"🍎",type:"sweet",koji:true,time:"15分＋冷凍",desc:"素材の甘さを楽しむ、ごほうびアイス",ing:[["りんご",1,"個"],["さつまいも",200,"g"],["甘糀",60,"g"]],steps:["りんごとさつまいもをやわらかく加熱する。","甘糀と合わせてなめらかにし、冷凍する。"],note:"少し室温に置いてから食べるとなめらかです。"},
{id:9,title:"ジャポネソース",emoji:"🥣",type:"sauce",koji:false,time:"10分",desc:"肉にも野菜にも。覚えておきたい万能ソース",ing:[["玉ねぎ",100,"g"],["醤油",30,"ml"],["酢",15,"ml"]],steps:["玉ねぎをすりおろす。","調味料と合わせて軽く加熱する。"],note:"これは完成料理に使うソースのレシピです。糀そのものを作るレシピは公開していません。"}
];
let active="all",query="",current=null,serv=2;let favs=JSON.parse(localStorage.getItem("kojiFavs")||"[]");
function render(){let a=recipes.filter(r=>(active==="all"||(active==="koji"&&r.koji)||(active==="no"&&!r.koji)||r.type===active)&&(!query||(r.title+r.desc).includes(query)));if(active==="fav")a=a.filter(r=>favs.includes(r.id));grid.innerHTML=a.map(r=>'<article class="card" onclick="openRecipe('+r.id+')"><div class="photo">'+r.emoji+'<small>イメージ</small><button class="fav" onclick="event.stopPropagation();toggleFav('+r.id+')">'+(favs.includes(r.id)?"♥":"♡")+'</button></div><div class="cardbody"><div class="tags"><span class="tag '+(r.koji?"":"green")+'">'+(r.koji?"糀を使う":"糀なし")+'</span><span class="tag">'+label(r.type)+'</span></div><h3>'+r.title+'</h3><div class="meta">⏱ '+r.time+'　'+r.desc+'</div></div></article>').join("");count.textContent=a.length+"レシピ";empty.style.display=a.length?"none":"block";favCount.textContent=favs.length}
function label(t){return {main:"主菜",side:"副菜",sweet:"スイーツ",sauce:"ソース"}[t]||t}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem("kojiFavs",JSON.stringify(favs));render()}
function showFav(){active="fav";listTitle.textContent="お気に入り";document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));render()}
function resetAll(){active="all";query="";search.value="";listTitle.textContent="今日作りたいレシピ";document.querySelector('[data-f="all"]').click()}
function focusSearch(){search.style.display="block";search.focus()}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");active=b.dataset.f;listTitle.textContent=b.textContent.trim();render()});
search.oninput=e=>{query=e.target.value.trim();render()};
function openRecipe(id){current=recipes.find(r=>r.id===id);serv=2;detailEmoji.childNodes[0].nodeValue=current.emoji;detailTitle.textContent=current.title;detailMeta.textContent="⏱ "+current.time+"　"+current.desc;detailTags.innerHTML='<span class="tag">'+(current.koji?"🌾 糀を使う":"糀を使わない")+'</span><span class="tag">'+label(current.type)+'</span>';steps.innerHTML=current.steps.map(s=>"<li>"+s+"</li>").join("");note.textContent="💡 "+current.note;document.querySelectorAll(".servings button").forEach(x=>x.classList.toggle("on",x.dataset.s==="2"));drawIng();modal.classList.add("on");document.body.style.overflow="hidden"}
function drawIng(){ingredients.innerHTML=current.ing.map(i=>"<tr><td>"+i[0]+"</td><td>"+(i[1]===null?i[2]:fmt(i[1]*serv/2)+i[2])+"</td></tr>").join("")}
function fmt(n){return Number.isInteger(n)?n:Math.round(n*10)/10}
document.querySelectorAll(".servings button").forEach(b=>b.onclick=()=>{serv=+b.dataset.s;document.querySelectorAll(".servings button").forEach(x=>x.classList.toggle("on",x===b));drawIng()});
function closeModal(){modal.classList.remove("on");document.body.style.overflow=""}modal.onclick=e=>{if(e.target===modal)closeModal()};render();
</script></body></html>
