<script>
const recipes=[
{id:1,title:"ケンタッキー風チキン",type:"main",koji:"醤油麹",time:"30分",desc:"やわらかジューシーな定番",pos:"51% 63%",ing:[["鶏肉",300,"g"],["醤油麹",30,"g"],["米粉",40,"g"],["油",null,"適量"]],steps:["鶏肉を食べやすく切り、醤油麹となじませる。","米粉をまぶし、火が通るまで香ばしく揚げ焼きにする。"],note:"2人分を基準に人数で自動換算します。"},
{id:2,title:"奈良漬入りポテトサラダ",type:"side",koji:"",time:"20分",desc:"いつものポテサラに楽しいアクセント",pos:"42% 78%",ing:[["じゃがいも",300,"g"],["奈良漬",30,"g"],["マヨネーズ",30,"g"]],steps:["じゃがいもをやわらかくして粗くつぶす。","刻んだ奈良漬と調味料を混ぜる。"],note:"奈良漬の塩味を見ながら味を整えてください。"},
{id:3,title:"季節のグリル野菜",type:"side",koji:"コンソメ糀",time:"25分",desc:"野菜の甘みを楽しむあと一品",pos:"28% 57%",ing:[["季節の野菜",300,"g"],["コンソメ糀",20,"g"],["油",15,"ml"]],steps:["野菜を食べやすく切る。","コンソメ糀と油をなじませ、香ばしく焼く。"],note:"冷蔵庫にある野菜で気軽にどうぞ。"},
{id:4,title:"黒蜜きなこの甘糀お豆腐豆花",type:"sweet",koji:"甘糀",time:"15分",desc:"ほっとする甘さの発酵おやつ",pos:"87% 75%",ing:[["豆腐",200,"g"],["甘糀",40,"g"],["きなこ",10,"g"],["黒蜜",null,"お好み"]],steps:["豆腐と甘糀をなめらかになるまで合わせる。","器に盛り、きなこと黒蜜を添える。"],note:"甘さはお好みで調整してください。"},
{id:5,title:"トマトのごま味噌和え",type:"side",koji:"",time:"10分",desc:"切って和えるだけの忙しい日の味方",pos:"25% 66%",ing:[["トマト",2,"個"],["味噌",20,"g"],["すりごま",15,"g"]],steps:["トマトを食べやすく切る。","味噌とすりごまを合わせて和える。"],note:"食べる直前に和えるのがおすすめです。"},
{id:6,title:"牛肉と夏野菜のオイスター炒め",type:"main",koji:"中華麹",time:"20分",desc:"ごはんが進む満足おかず",pos:"52% 60%",ing:[["牛肉",200,"g"],["夏野菜",250,"g"],["中華麹",20,"g"],["オイスターソース",20,"g"]],steps:["牛肉と野菜を食べやすく切る。","牛肉、野菜の順に炒め、調味料を加える。"],note:"季節の野菜に置き換えて楽しめます。"},
{id:7,title:"米粉パンケーキ",type:"sweet",koji:"",time:"20分",desc:"休日の朝にうれしいふんわりおやつ",pos:"87% 76%",ing:[["米粉",120,"g"],["豆乳",120,"ml"],["卵",1,"個"]],steps:["材料を混ぜ合わせる。","温めたフライパンで両面を焼く。"],note:"個数材料は人数変更時に端数になる場合があります。"},
{id:8,title:"りんごとお芋の重ね煮甘糀アイス",type:"sweet",koji:"甘糀",time:"15分＋冷凍",desc:"素材の甘さを楽しむごほうびアイス",pos:"88% 74%",ing:[["りんご",1,"個"],["さつまいも",200,"g"],["甘糀",60,"g"]],steps:["りんごとさつまいもをやわらかく加熱する。","甘糀と合わせてなめらかにし、冷凍する。"],note:"少し室温に置くとなめらかです。"},
{id:9,title:"ジャポネソース",type:"sauce",koji:"",time:"10分",desc:"肉にも野菜にも使える万能ソース",pos:"40% 75%",ing:[["玉ねぎ",100,"g"],["醤油",30,"ml"],["酢",15,"ml"]],steps:["玉ねぎをすりおろす。","調味料と合わせて軽く加熱する。"],note:"完成料理に使うソースです。"}
];let active="all",k="",q="",current,serv=2,favs=JSON.parse(localStorage.getItem("kojiFavs")||"[]");
const typeName={main:"主菜",side:"副菜",soup:"スープ",sweet:"スイーツ",sauce:"ソース"};
function imageStyle(r){const imgs={1:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=85",2:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=85",3:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85",4:"https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=900&q=85",5:"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=900&q=85",6:"https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=900&q=85",7:"https://images.unsplash.com/photo-1528207776546-365bb710ee93?auto=format&fit=crop&w=900&q=85",8:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=900&q=85",9:"https://images.unsplash.com/photo-1476224203421-9ac39bcb3327?auto=format&fit=crop&w=900&q=85"};return imgs[r.id]||imgs[3]}
function render(){let a=recipes.filter(r=>(active==="all"||(active==="koji"&&r.koji)||(active==="no"&&!r.koji)||r.type===active)&&(!k||r.koji===k)&&(!q||(r.title+r.desc+r.koji+r.ing.map(x=>x[0]).join("")).includes(q)));if(active==="fav")a=a.filter(r=>favs.includes(r.id));grid.innerHTML=a.map(r=>'<article class="card" onclick="openRecipe('+r.id+')"><div class="photo"><img src="'+imageStyle(r)+'" style="object-position:'+r.pos+'"><button class="fav" onclick="event.stopPropagation();toggleFav('+r.id+')">'+(favs.includes(r.id)?"♥":"♡")+'</button></div><div class="cardbody"><div class="tags"><span class="tag '+(!r.koji?"g":"")+'">'+(r.koji||"糀なし")+'</span><span class="tag g">'+typeName[r.type]+'</span></div><h3>'+r.title+'</h3><div class="meta">◷ '+r.time+'　'+r.desc+'</div></div></article>').join("");empty.style.display=a.length?"none":"block"}
function filter(v){active=v;k="";document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.f===v));render()}document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>filter(b.dataset.f));document.querySelectorAll(".koji").forEach(b=>b.onclick=()=>{k=b.dataset.k;active="all";document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));render();window.scrollTo({top:700,behavior:"smooth"})});
function searchNow(v){q=v.trim();render()}search.oninput=e=>searchNow(e.target.value);navSearch.oninput=e=>{search.value=e.target.value;searchNow(e.target.value)};
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem("kojiFavs",JSON.stringify(favs));render()}function showFav(){active="fav";k="";render();window.scrollTo({top:650,behavior:"smooth"})}function resetAll(){active="all";k="";q="";search.value="";navSearch.value="";filter("all");scrollTo({top:0,behavior:"smooth"})}function focusSearch(){scrollTo({top:250,behavior:"smooth"});setTimeout(()=>search.focus(),400)}
function openRecipe(id){current=recipes.find(r=>r.id===id);serv=2;detailImg.src=imageStyle(current);detailImg.style.objectPosition=current.pos;detailTitle.textContent=current.title;detailMeta.textContent="◷ "+current.time+"　"+current.desc;detailTags.innerHTML='<span class="tag">'+(current.koji||"糀なし")+'</span><span class="tag g">'+typeName[current.type]+'</span>';steps.innerHTML=current.steps.map(x=>"<li>"+x+"</li>").join("");note.textContent="💡 "+current.note;document.querySelectorAll(".serv button").forEach(x=>x.classList.toggle("on",x.dataset.s==="2"));drawIng();modal.classList.add("on");document.body.style.overflow="hidden"}function drawIng(){ingredients.innerHTML=current.ing.map(i=>"<tr><td>"+i[0]+"</td><td>"+(i[1]===null?i[2]:(Math.round(i[1]*serv/2*10)/10)+i[2])+"</td></tr>").join("")}document.querySelectorAll(".serv button").forEach(b=>b.onclick=()=>{serv=+b.dataset.s;document.querySelectorAll(".serv button").forEach(x=>x.classList.toggle("on",x===b));drawIng()});function closeModal(){modal.classList.remove("on");document.body.style.overflow=""}modal.onclick=e=>{if(e.target===modal)closeModal()};render();
</script></body></html>
