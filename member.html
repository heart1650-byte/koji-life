<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会員登録・マイページ｜糀Life</title><link rel="stylesheet" href="member.css"><script src="vendor/supabase-2.58.0.js"></script><script src="member-api.js"></script><script src="shop-core.js"></script></head><body><main><nav><a href="./">レシピ</a><a href="shop.html">商品・カート</a><a href="member.html">マイページ</a></nav><h1>会員登録・マイページ</h1><p id="status" class="notice" role="status">読み込み中です。</p><section id="login" class="card" hidden><h2>メールで登録・ログイン</h2><p>会員登録は無料です。有料サービスへの加入は、別途お申し込みいただいた場合のみです。</p><form id="send"><label>メールアドレス<input id="email" type="email" autocomplete="email" required maxlength="254"></label><label class="check"><input id="consent" type="checkbox" required><span><a href="privacy.html">個人情報の取り扱い</a>を確認しました</span></label><label class="check"><input id="remember" type="checkbox"><span>この端末でログインを保持する（共有端末では選択しない）</span></label><button>認証コードを送る</button></form><form id="verify" hidden><label>メールに届いた認証コード<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" required></label><button>認証してログイン</button></form></section><section id="account" hidden><p id="accountEmail"></p><button id="logout" class="secondary">ログアウト</button><a id="adminLink" href="member-admin.html" hidden>管理画面へ</a><form id="profile" class="card"><h2>会員情報・配送先</h2><p>購入には、以下の配送先情報の登録が必要です。国内発送のみです。</p><label>お名前<input name="name" autocomplete="name" maxlength="100" required></label><label>配送先の宛名<input name="recipient" autocomplete="shipping name" maxlength="100"></label><label>郵便番号<input name="postal_code" autocomplete="shipping postal-code" inputmode="numeric" maxlength="8"></label><label>都道府県<select name="prefecture" autocomplete="shipping address-level1"><option value="">選択してください</option></select></label><label>市区町村・番地・建物名・部屋番号<input name="address" autocomplete="shipping street-address" maxlength="300"></label><label>電話番号<input name="phone" type="tel" autocomplete="tel" maxlength="15"></label><label class="check"><input name="marketing_opt_in" type="checkbox"><span>お知らせメールを希望する（任意）</span></label><p><a href="privacy.html">個人情報の取り扱い</a>をご確認の上、保存してください。</p><button>会員情報を保存</button></form><section class="card"><h2>注文履歴</h2><div id="orders"></div></section><p>情報の訂正・退会のお問い合わせ：<a href="mailto:heart1650@gmail.com">heart1650@gmail.com</a></p></section></main><script src="member.js"></script></body></html>
