<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>糀を購入｜糀Life</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#493d34;font:16px/1.8 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 18px 70px}h1{font-size:30px}h2{font-size:22px}a{color:#a23e4d}.card{padding:22px;margin:18px 0;background:white;border:1px solid #ead8cc;border-radius:20px}.button,button{display:inline-block;padding:12px 20px;background:#bc4658;color:white;border:0;border-radius:12px;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select,textarea{width:100%;padding:10px;border:1px solid #d7c5b9;border-radius:10px;font:inherit}label{display:block;margin:14px 0 4px}textarea{min-height:90px}.muted{font-size:13px;color:#786458}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}#status{white-space:pre-wrap}.check{display:flex;gap:10px;align-items:center}.check input{width:20px}@media(max-width:500px){.row{grid-template-columns:1fr}}</style><script src="shop-core.js"></script></head><body><main><a href="./">🌾 糀Life レシピ一覧</a><h1>いつもの料理に、糀を。</h1><p>小春日和の発酵調味料</p><section class="card"><h2>ユーワードで購入</h2><p id="externalNotice">店舗リンクの準備中です。</p><a id="externalStore" class="button" hidden target="_blank" rel="noopener noreferrer">ユーワードの店舗へ</a></section><div id="products"></div><section class="card"><h2>糀Lifeから注文を相談する</h2><p id="orderNotice">直接注文は準備中です。</p><form id="orderForm" hidden><label for="productSelect">商品</label><select id="productSelect"></select><label for="quantity">数量</label><input id="quantity" type="number" min="1" step="1" value="1"><label for="payment">希望のお支払い方法</label><select id="payment"></select><p id="total"></p><p>注文内容をメールで送信すると、販売者が在庫と合計金額を確認して返信します。返信までは注文確定・在庫確保ではありません。銀行振込は返信後にお願いします。PayPayをご希望の場合は販売者が通販用決済の案内を返信します。</p><p class="muted">ここでは氏名や住所を入力しません。配送先は販売者とのメールでお伝えください。</p><a id="sendOrder" class="button">注文内容をメールで送る</a><p id="bankInfo"></p><a id="legalLink" hidden target="_blank" rel="noopener noreferrer">販売条件・特定商取引法に基づく表記</a></form></section><p id="status" role="status"></p></main><script src="shop.js"></script></body></html>
