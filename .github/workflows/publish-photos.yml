name: Publish approved recipe photos
on:
  push:
    branches: [main]
    paths: ['submissions/*.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-recipe-photos
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/publish-photos.py
      - name: Save approved photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community-recipes.json assets/recipes
          if ! git diff --cached --quiet; then
            git commit -m 'Publish owner-approved recipe photographs'
            git push
          fi
      - name: Deploy updated public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/builds
